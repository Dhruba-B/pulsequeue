apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: pulsequeue
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: pulsequeue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/part-of: pulsequeue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: pulsequeue
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              ollama serve &
              server_pid=$!
              until ollama list >/dev/null 2>&1; do
                sleep 2
              done
              ollama pull qwen2.5:3b
              wait "$server_pid"
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "ollama list | grep -q '^qwen2.5:3b'"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: pulsequeue
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: pulsequeue
  ports:
    - name: http
      port: 11434
      targetPort: http
