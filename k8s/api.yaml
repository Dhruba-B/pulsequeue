apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: pulsequeue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-server
      app.kubernetes.io/part-of: pulsequeue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-server
        app.kubernetes.io/part-of: pulsequeue
    spec:
      containers:
        - name: api-server
          image: pulsequeue-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: pulsequeue-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pulsequeue-secrets
                  key: OPENAI_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: pulsequeue
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/part-of: pulsequeue
  ports:
    - name: http
      port: 5000
      targetPort: http
