apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: pulsequeue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
      app.kubernetes.io/part-of: pulsequeue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/part-of: pulsequeue
    spec:
      containers:
        - name: scheduler
          image: pulsequeue-scheduler:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pulsequeue-config
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
